<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNN Interactive Visualization</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
        xintegrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71bZBTIQHQ" crossorigin="anonymous">

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
        xintegrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfPe451b0KJE0i"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbOxyj0O1rxVqTGbT0kqO13dGQ"
        crossorigin="anonymous"></script>

    <style>
        /* Smooth transitions for interactive elements */
        .node-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .active-node {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            border-color: #3b82f6;
            opacity: 1 !important;
            z-index: 10;
        }

        .inactive-node {
            opacity: 0.3;
            filter: grayscale(80%);
        }

        /* Layout overrides to ensure KaTeX renders nicely in our boxes */
        .katex-display {
            margin: 0.5em 0;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col selection:bg-blue-200">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                    </path>
                </svg>
                RNN Visualization: The Video Game Analogy
            </h1>
            <div class="text-sm font-semibold bg-blue-100 text-blue-800 px-4 py-1.5 rounded-full" id="step-indicator">
                Step 1 of X
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Left Panel: Text & Explanation -->
        <div
            class="lg:col-span-5 bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden flex flex-col h-full min-h-[500px]">
            <!-- Progress Bar -->
            <div class="h-1.5 bg-gray-100 w-full">
                <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-500 ease-out"
                    style="width: 0%;"></div>
            </div>

            <div class="p-8 flex-grow overflow-y-auto" id="text-panel">
                <h2 id="step-title" class="text-3xl font-extrabold text-gray-900 mb-6 leading-tight">Title</h2>

                <div id="step-desc" class="text-lg text-gray-700 space-y-4 mb-6 leading-relaxed">
                    Description
                </div>

                <div id="step-formula"
                    class="bg-blue-50/50 rounded-xl p-4 border border-blue-100 text-blue-900 text-center min-h-[80px] flex items-center justify-center">
                    Formula
                </div>
            </div>

            <!-- Controls -->
            <div class="p-6 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
                <button id="btn-back" onclick="changeStep(-1)"
                    class="px-6 py-2.5 rounded-lg font-semibold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 hover:text-blue-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                    Back
                </button>
                <button id="btn-next" onclick="changeStep(1)"
                    class="px-6 py-2.5 rounded-lg font-semibold text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow-md shadow-blue-500/30 flex items-center gap-2">
                    Next Step
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Right Panel: Visual Diagram -->
        <div class="lg:col-span-7 bg-slate-900 rounded-2xl shadow-xl p-6 md:p-10 flex items-center justify-center min-h-[600px] relative overflow-hidden"
            id="diagram-panel">

            <!-- Network Diagram Structure -->
            <div class="relative w-full max-w-2xl flex flex-col items-center select-none text-sm md:text-base">

                <!-- TOP: Output -->
                <div class="flex flex-col items-center mb-8">
                    <div id="node-y_t"
                        class="node-transition bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg border-2 border-indigo-400 min-w-[140px] text-center z-10">
                        <span class="block text-indigo-100 text-xs uppercase tracking-wider mb-1">Output Action</span>
                        <div id="val-y_t">$y_t$</div>
                    </div>

                    <div class="h-10 w-0 border-l-4 border-dashed border-indigo-400 relative node-transition"
                        id="path-out">
                        <div class="absolute -top-1 -left-2 text-indigo-400">▲</div>
                    </div>

                    <div class="flex gap-4 mb-2">
                        <div id="node-w_hy"
                            class="node-transition bg-slate-800 text-indigo-300 py-1 px-3 rounded-md border border-slate-700 text-center">
                            <span class="text-xs block">Rule</span>
                            <div id="val-w_hy">$W_{hy}$</div>
                        </div>
                        <div id="node-b_y"
                            class="node-transition bg-slate-800 text-indigo-300 py-1 px-3 rounded-md border border-slate-700 text-center">
                            <span class="text-xs block">Bonus</span>
                            <div id="val-b_y">$b_y$</div>
                        </div>
                    </div>
                </div>

                <!-- MIDDLE: Memory Flow & RNN Cell -->
                <div class="flex items-center justify-center w-full relative">

                    <!-- Past Memory -->
                    <div id="node-h_prev"
                        class="node-transition bg-emerald-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg border-2 border-emerald-500 z-10 min-w-[140px] text-center absolute left-0 md:left-[-20px]">
                        <span class="block text-emerald-100 text-xs uppercase tracking-wider mb-1">Past Memory</span>
                        <div id="val-h_prev">$h_{t-1}$</div>
                    </div>

                    <!-- Flow arrow from Past Memory to Cell -->
                    <div class="flex-grow flex items-center justify-center text-emerald-500 mx-4 node-transition"
                        id="path-h_prev">
                        <div class="w-12 md:w-20 border-b-4 border-emerald-500 relative">
                            <div class="absolute -right-2 -top-2">▶</div>
                        </div>
                    </div>

                    <!-- The Main RNN Cell -->
                    <div id="node-cell"
                        class="node-transition bg-slate-800 border-4 border-slate-600 rounded-2xl p-6 shadow-2xl relative z-20 flex flex-col items-center justify-center w-full max-w-[280px]">
                        <div
                            class="absolute -top-3 bg-slate-900 text-slate-400 px-2 text-xs uppercase tracking-widest rounded">
                            RNN Logic</div>

                        <!-- Summation Node -->
                        <div id="node-sum"
                            class="node-transition w-16 h-16 rounded-full bg-slate-700 border-2 border-slate-500 flex items-center justify-center text-2xl font-bold text-white mb-6 shadow-inner relative">
                            $\Sigma$
                            <div class="absolute -right-16 -top-4 flex flex-col items-center" id="node-b_h-container">
                                <span class="text-slate-400 text-xs mb-1">Bias</span>
                                <div id="node-b_h"
                                    class="node-transition bg-slate-900 text-orange-300 py-1 px-2 rounded border border-slate-700 text-sm">
                                    <div id="val-b_h">$b_h$</div>
                                </div>
                            </div>
                            <!-- Small plus line from bias -->
                            <div class="absolute -right-4 top-1/2 w-4 border-b-2 border-slate-500" id="path-bias"></div>
                        </div>

                        <!-- Downward arrow inside cell -->
                        <div class="text-slate-500 mb-2">▼</div>

                        <!-- Tanh Node -->
                        <div id="node-tanh"
                            class="node-transition bg-rose-900/50 text-rose-300 border-2 border-rose-700 py-2 px-8 rounded-lg font-bold shadow-lg text-center w-full">
                            <span class="text-xs uppercase tracking-wider block text-rose-400 mb-1">Squasher</span>
                            <div id="val-tanh">$\tanh()$</div>
                        </div>
                    </div>

                    <!-- Flow arrow from Cell to New Memory -->
                    <div class="flex-grow flex items-center justify-center text-blue-500 mx-4 node-transition"
                        id="path-h_new">
                        <div class="w-12 md:w-20 border-b-4 border-blue-500 relative">
                            <div class="absolute -right-2 -top-2">▶</div>
                        </div>
                    </div>

                    <!-- New Memory -->
                    <div id="node-h_t"
                        class="node-transition bg-blue-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg border-2 border-blue-500 z-10 min-w-[140px] text-center absolute right-0 md:right-[-20px]">
                        <span class="block text-blue-200 text-xs uppercase tracking-wider mb-1">New Memory</span>
                        <div id="val-h_t">$h_t$</div>
                    </div>
                </div>

                <!-- BOTTOM: Input -->
                <div class="flex flex-col items-center mt-8">
                    <div class="flex gap-4 mt-2 order-2">
                        <div id="node-w_xh"
                            class="node-transition bg-slate-800 text-amber-300 py-1 px-3 rounded-md border border-slate-700 text-center">
                            <span class="text-xs block">Input Rule</span>
                            <div id="val-w_xh">$W_{xh}$</div>
                        </div>
                        <div id="node-w_hh"
                            class="node-transition bg-slate-800 text-emerald-300 py-1 px-3 rounded-md border border-slate-700 text-center">
                            <span class="text-xs block">Memory Rule</span>
                            <div id="val-w_hh">$W_{hh}$</div>
                        </div>
                    </div>

                    <div class="h-10 w-0 border-l-4 border-dashed border-amber-400 relative node-transition order-1 mb-2"
                        id="path-in">
                        <div class="absolute -top-3 -left-2 text-amber-400">▲</div>
                    </div>

                    <div id="node-x_t"
                        class="node-transition bg-amber-500 text-slate-900 font-bold py-3 px-6 rounded-xl shadow-lg border-2 border-amber-400 min-w-[140px] text-center z-10 order-3 mt-4">
                        <span class="block text-amber-900 text-xs uppercase tracking-wider mb-1">Current Input</span>
                        <div id="val-x_t">$x_t$</div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="../js/rnn_math.js"></script>
</body>

</html>
