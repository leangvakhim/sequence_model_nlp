<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRU Concept Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Auto-render extension to easily parse $...$ and $$...$$ -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Custom styles for visual flair */
        body {
            background-color: #f3f4f6;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .striped-bg {
            background-image: repeating-linear-gradient(45deg,
                    #d1d5db,
                    #d1d5db 10px,
                    #e5e7eb 10px,
                    #e5e7eb 20px);
        }

        /* KaTeX formula size adjustments */
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px 0;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <main class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden flex flex-col h-[85vh] sm:h-[650px]">

        <!-- Header / Progress Area -->
        <header class="bg-indigo-600 text-white p-5 sm:px-8 border-b border-indigo-700">
            <div class="flex justify-between items-end mb-2">
                <h1 class="text-xl sm:text-2xl font-bold">The GRU Storyteller</h1>
                <span id="step-counter" class="text-sm font-medium opacity-80">Step 1 / 11</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-indigo-900 rounded-full h-2 mt-2">
                <div id="progress-bar" class="bg-yellow-400 h-2 rounded-full transition-all duration-300"
                    style="width: 0%"></div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-grow overflow-y-auto p-6 sm:p-8 fade-in" id="content-container">
            <h2 id="step-title" class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2 border-gray-200">Title
                Placeholder</h2>
            <div id="step-body" class="text-lg leading-relaxed text-gray-700 space-y-4">
                <!-- Content injected via JS -->
            </div>
        </div>

        <!-- Footer / Controls -->
        <footer class="bg-gray-50 border-t border-gray-200 p-4 sm:px-8 flex justify-between items-center mt-auto">
            <button id="btn-back"
                class="px-5 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center shadow-sm">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back
            </button>
            <button id="btn-next"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center shadow-md">
                Next
                <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </footer>
    </main>

    <script src="../js/gru_storyteller.js"></script>
</body>

</html>
