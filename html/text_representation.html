<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Representation Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simple fade-in animation class */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- Main Card Container -->
    <div
        class="bg-white max-w-4xl w-full rounded-2xl shadow-xl overflow-hidden border border-gray-100 flex flex-col h-[650px] max-h-[90vh]">

        <!-- Header -->
        <header class="bg-blue-600 text-white p-6 shrink-0">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Text Representation in NLP
            </h1>
            <p class="text-blue-100 mt-1 text-sm">Understanding how machines read text, step-by-step.</p>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 p-6 md:p-8 flex flex-col overflow-y-auto">

            <!-- Step Text Context -->
            <div class="mb-6 md:mb-8 shrink-0">
                <div class="text-sm font-bold text-blue-500 uppercase tracking-wider mb-2" id="step-counter">Step 1 of 7
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-3" id="step-title">The Raw Text</h2>
                <p class="text-gray-600 text-lg leading-relaxed" id="step-desc">Before a computer can understand
                    language, it starts with a raw string of characters.</p>
            </div>

            <!-- Visual Display Area -->
            <div class="flex-1 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 flex flex-col p-4 md:p-6 relative overflow-auto min-h-[300px]"
                id="visual-container">
                <!-- Visual content gets injected here by JavaScript -->
            </div>

        </main>

        <!-- Navigation Footer -->
        <footer class="border-t border-gray-100 p-6 flex justify-between items-center bg-gray-50 shrink-0">
            <button id="btn-prev"
                class="px-6 py-2.5 rounded-lg font-medium text-gray-600 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Previous
            </button>

            <!-- Progress Dots -->
            <div class="flex gap-2 flex-wrap justify-center max-w-[50%]" id="progress-dots">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm flex items-center gap-2">
                Next Step
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </footer>
    </div>

    <script src="../js/text_representation.js"></script>
</body>

</html>
